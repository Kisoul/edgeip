name: Check Google GeoIP and Filter TR

on:
  workflow_dispatch: 
  schedule:
    - cron: '0 1 * * *' 

jobs:
  check-ips:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check IP Location via YouTube and Filter TR
        run: |
          mkdir -p Data/Google
          > Data/Google/TR.txt
          
          cat Data/TR.txt | while read line || [[ -n $line ]]; do
            
            # 提取 IP:端口
            ip_port=$(echo "$line" | awk -F'#' '{print $1}')
            
            if [ -z "$ip_port" ]; then
              continue
            fi

            echo "正在测试: $ip_port ..."
            
            # 【关键修改】使用 -x 参数（代理模式）代替 --resolve，这样就能原封不动地请求你列表里特定的端口(如 8443, 2053 等)
            response=$(curl -s -i -m 15 -x "http://$ip_port" -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" https://www.youtube.com || true)
            
            # 修复 Broken pipe 错误，安全提取状态码
            http_code=$(echo "$response" | awk 'NR==1 {print $2}' | tr -d '\r')
            
            # 提取 GL 地区代码
            region=$(echo "$response" | grep -oP '"GL":"\K[^"]+' | head -n 1)

            if [ -n "$region" ]; then
              echo "✅ $ip_port -> 成功! 地区: $region (状态码: $http_code)"
              
              if [ "$region" == "TR" ]; then
                echo "$line" >> Data/Google/TR.txt
              fi
              
            else
              if [ -z "$http_code" ]; then
                echo "❌ $ip_port -> 彻底超时无响应"
              elif [ "$http_code" == "403" ]; then
                echo "🚫 $ip_port -> 被防火墙拦截 (403 Forbidden)"
              else
                echo "⚠️ $ip_port -> 请求失败，状态码: $http_code"
              fi
            fi
            
          done
          
      - name: Show Results
        run: |
          echo "==== 筛选出 Google 归属地为 TR 的节点 ===="
          cat Data/Google/TR.txt

      - name: Commit and Push Results
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add Data/Google/TR.txt
          git commit -m "Auto updated Google TR IPs" || exit 0
          git push
